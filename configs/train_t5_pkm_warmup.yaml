strategy: t5_seq2seq

global:
  seed: 42

train:
  optim: adamw_torch
  lr_scheduler_type: cosine
  warmup_ratio: 0.01
  weight_decay: 0.001
  learning_rate: 0.0003
  epochs: 50
  batch_size: 512
  per_device_batch_size: 256
  gradient_accumulation_steps: 2
  logging_step: 1
  save_and_eval_strategy: epoch
  save_and_eval_steps: 1000
  model_max_length: 512

dataset:
  tasks: seqrec
  max_his_len: 20
  only_train_response: false
  train_prompt_sample_num: "1"
  train_data_sample_num: "-1"
  valid_prompt_id: 0
  sample_valid: true
  valid_prompt_sample_num: 2

model:
  t5_seq2seq:
    base_model: google-t5/t5-small
    model_max_length: 512

pkm:
  t5_seq2seq:
    pk_is_enabled: true
    pk_encoder_layers: []
    pk_decoder_layers: [2]
    pk_mem_n_keys: 128
    pk_mem_heads: 4
    pk_mem_knn: 32
    pk_mem_k_dim: 512
    pk_mem_v_dim: -1
    pk_mem_share_values: false
    pk_mem_gated: false
    pk_topk: 8
    pk_value_fixed_lr: 0.001
    pk_value_weight_decay: 0.0
    pk_warmup_epochs: 10

routing:
  enabled: false
  early_layers: [3]
  recent_history_len: 2
  gate_l1_weight: 0.0
  aux_loss_weight: 0.0
