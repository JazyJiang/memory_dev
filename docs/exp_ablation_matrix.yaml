# Ablation Matrix — sweeps PKM on/off × train/test history truncation
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python docs/run_t5_pkm_sweep.py \
#     --sweep_yaml docs/exp_ablation_matrix.yaml \
#     --runner_sh docs/train_t5_pkm_warmup_sweep.sh
#
# Produces 6 valid combos (train trunc + test full is auto-filtered):
#   A1: pk=true,  trainH=-1, testH=-1   (PKM baseline)
#   A2: pk=true,  trainH=-1, testH=2    (PKM + test trunc)
#   A3: pk=true,  trainH=2,  testH=2    (PKM + train&test trunc)
#   A4: pk=false, trainH=-1, testH=-1   (no-PKM baseline)
#   A5: pk=false, trainH=-1, testH=2    (no-PKM + test trunc)
#   A6: pk=false, trainH=2,  testH=2    (no-PKM + train&test trunc)

strategy: t5_seq2seq

# Fixed training params (from pkm_warmup_sweep.yaml best config)
train.learning_rate: 1.0e-3
train.batch_size: 512

# Sweep: PKM on/off
pkm.t5_seq2seq.pk_is_enabled: [true, false]

# Fixed PKM architecture (used when pk_is_enabled=true, ignored when false)
placement_pairs:
  - {enc: "", dec: "3"}

capacity_pairs:
  - {n_keys: 128, topk: 32}

pkm.t5_seq2seq.pk_mem_k_dim: 512
pkm.t5_seq2seq.pk_mem_v_dim: -1
pkm.t5_seq2seq.pk_value_fixed_lr: "tied"
pkm.t5_seq2seq.pk_value_weight_decay: 0.0
pkm.t5_seq2seq.pk_mem_gated: false
pkm.t5_seq2seq.pk_mem_share_values: false

# Sweep: history truncation
# -1 = full history, 2 = keep most recent 2 items
dataset.train_max_his_len: [-1, 2]
dataset.test_max_his_len: [-1, 2]
# Note: combo (train=2, test=-1) is auto-skipped by validate_combo
