# PKM Warmup Strategy Sweep Configuration
# Usage: This file defines the search space for the warmup strategy experiments.

strategy: t5_seq2seq

# Fixed Base Parameters
train:
  learning_rate: 1.0e-3
  batch_size: 512
  epochs: 50

# PKM Fixed Configuration
pkm:
  t5_seq2seq:
    pk_is_enabled: true
    pk_mem_n_keys: 128
    pk_topk: 32
    pk_encoder_layers: ""
    pk_decoder_layers: "3"

# ----- Sweep Candidates -----
# Quick verification setup:
# - Total train epochs: 5 (see train.epochs)
# - D0 warmup fixed to 0
# - D1-D3 warmup fixed to 2
sweep_params:
  d0_warmup_epochs: [0]
  finetune_warmup_epochs: [30, 40]