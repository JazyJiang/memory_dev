# PKM Warmup Strategy Sweep Configuration
# Usage: This file defines the search space for the warmup strategy experiments.

strategy: t5_seq2seq

# Fixed Base Parameters
train:
  learning_rate: 1.0e-3
  batch_size: 512
  epochs: 50

# PKM Fixed Configuration
pkm:
  t5_seq2seq:
    pk_is_enabled: true
    pk_mem_n_keys: 30
    pk_mem_knn: 16
    pk_topk: 36
    pk_encoder_layers: ""
    pk_decoder_layers: "3"

# ----- Sweep Candidates -----
# exp/forced-group-routing branch:
# - warmup covers all epochs (d0=50, ft=50) so mask is always active during training
# - test phase also applies mask via --force_routing_test flag
sweep_params:
  d0_warmup_epochs: [50]
  finetune_warmup_epochs: [50]