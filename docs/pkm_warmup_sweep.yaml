# PKM Warmup Strategy Sweep Configuration
# Usage: This file defines the search space for the warmup strategy experiments.

strategy: t5_seq2seq

# Fixed Base Parameters
train:
  learning_rate: 1.0e-3
  batch_size: 512
  epochs: 50

# PKM Fixed Configuration (used as fallback if memory_configs not set)
pkm:
  t5_seq2seq:
    pk_is_enabled: true
    pk_encoder_layers: ""
    pk_decoder_layers: "3"

# ----- Sweep Candidates -----
# exp/forced-group-routing branch:
# - d0 warmup=0: D0 has no prev group info, mask is not applied during D0 training
# - ft warmup covers all epochs (ft=50) so mask is always active during finetune
# - test phase also applies mask via --force_routing_test flag
# - n_keys=125: 125/5=25 keys per group per half-set, knn=25 selects full partition,
#   topk=32 picks final 32 from 25*25=625 cartesian products
sweep_params:
  d0_warmup_epochs: [0]
  finetune_warmup_epochs: [50]
  memory_configs:
    - {n_keys: 125, knn: 25, topk: 32}